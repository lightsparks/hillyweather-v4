name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_OPENWEATHER_API_KEY: ${{ secrets.VITE_OPENWEATHER_API_KEY }}
          VITE_OPENWEATHER_BASE: ${{ secrets.VITE_OPENWEATHER_BASE }}
          VITE_OPENWEATHER_EXCLUDE: ${{ secrets.VITE_OPENWEATHER_EXCLUDE }}
          VITE_FALLBACK_LAT: ${{ secrets.VITE_FALLBACK_LAT }}
          VITE_FALLBACK_LON: ${{ secrets.VITE_FALLBACK_LON }}
          VITE_FALLBACK_CITY: ${{ secrets.VITE_FALLBACK_CITY }}
          VITE_FALLBACK_COUNTRY: ${{ secrets.VITE_FALLBACK_COUNTRY }}
          VITE_GEONAMES_USERNAME: ${{ secrets.VITE_GEONAMES_USERNAME }}
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          publish_dir: ./dist
          github_token: ${{ secrets.GITHUB_TOKEN }}
